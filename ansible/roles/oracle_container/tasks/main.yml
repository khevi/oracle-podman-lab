---
- name: Create Oracle data base directory
  ansible.builtin.file:
    path: "{{ oracle_data_base_dir }}"
    state: directory
    mode: "0755"

- name: Create Oracle persistent data directory
  ansible.builtin.file:
    path: "{{ oracle_oradata_dir }}"
    state: directory
    mode: "0755"

- name: Display Oracle persistent storage location
  ansible.builtin.debug:
    msg: "Oracle persistent data will be stored in {{ oracle_oradata_dir }}"

- name: Check rootless Podman status
  ansible.builtin.command:
    cmd: podman info --format '{{ "{{" }}.Host.Security.Rootless{{ "}}" }}'
  register: podman_rootless
  changed_when: false

- name: Display Podman rootless status
  ansible.builtin.debug:
    msg: "Podman rootless mode: {{ podman_rootless.stdout }}"

- name: Display planned Oracle container configuration
  ansible.builtin.debug:
    msg:
      - "Container: {{ oracle_container_name }}"
      - "Image: {{ oracle_image_name }}:{{ oracle_image_tag }}"
      - "Listener: {{ oracle_listener_port }}"
      - "Enterprise Manager: {{ oracle_em_port }}"
      - "Storage: {{ oracle_oradata_dir }} -> {{ oracle_container_oradata }}"

- name: Check whether Oracle 19c image exists locally
  ansible.builtin.command:
    cmd: podman image exists {{ oracle_image_name }}:{{ oracle_image_tag }}
  register: oracle_image_check
  changed_when: false
  failed_when: false

- name: Report Oracle image availability
  ansible.builtin.debug:
    msg: >-
      Oracle image {{ oracle_image_name }}:{{ oracle_image_tag }}
      {{ 'is available locally.' if oracle_image_check.rc == 0
         else 'is not available locally. Container deployment will be skipped.' }}

- name: Set Oracle image availability
  ansible.builtin.set_fact:
    oracle_image_available: "{{ oracle_image_check.rc == 0 }}"
